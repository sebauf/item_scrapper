apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-tracker-frontend
  namespace: price-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-tracker-frontend
  template:
    metadata:
      labels:
        app: price-tracker-frontend
    spec:
      # Requis seulement si les packages GHCR sont privés — voir k8s/README.md.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # Owner/tag réécrits par l'overlay via le transformer `images:`
          # (cf. overlays/prod/kustomization.yaml) — ne pas éditer à la main.
          image: ghcr.io/REPLACE_GITHUB_OWNER/item_scrapper-frontend:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Le frontend n'ouvre plus de connexion MongoDB : il interroge
            # l'API backend côté serveur, via son Service ClusterIP.
            - name: BACKEND_URL
              value: http://price-tracker-backend
            # Connexion Google (Auth.js) — cf. frontend/.env.example.
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AUTH_SECRET
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AUTH_GOOGLE_ID
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AUTH_GOOGLE_SECRET
            - name: AUTH_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AUTH_ALLOWED_EMAILS
                  optional: true
            # URL publique HTTPS, obligatoire : elle fixe l'URL de rappel OAuth
            # et fait poser des cookies `Secure` (préfixes __Secure- / __Host-),
            # que le navigateur n'envoie jamais en HTTP clair.
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AUTH_URL
            # Signe le jeton interne qui porte l'identité vers le backend.
            - name: BACKEND_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: BACKEND_AUTH_SECRET
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # /api/health est hors du middleware d'authentification : sonder `/`
          # ne mesurerait plus qu'une redirection vers /login.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
