apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: price-tracker
spec:
  replicas: 1
  # Le volume des logs est ReadWriteOnce : l'ancien Pod doit le lâcher avant
  # que le nouveau le monte (et deux schedulers ne doivent jamais coexister).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      # Doit pouvoir créer/surveiller des Pods (KubernetesPodOperator) :
      # cf. airflow-rbac.yaml.
      serviceAccountName: airflow-scheduler
      # Nom DNS **stable** pour le serveur de logs : avec le Service headless
      # `airflow-scheduler-logs` ci-dessous, ce Pod est résolu dans le cluster
      # sous airflow-scheduler.airflow-scheduler-logs.price-tracker.svc.<domaine>,
      # quel que soit son IP. Un seul réplica, stratégie Recreate : jamais deux
      # Pods sous ce nom.
      hostname: airflow-scheduler
      subdomain: airflow-scheduler-logs
      # L'image Airflow tourne en uid 50000 / gid 0 : le volume doit être
      # inscriptible par le groupe 0.
      securityContext:
        fsGroup: 0
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: scheduler
          image: ghcr.io/REPLACE_GITHUB_OWNER/item_scrapper-airflow:main
          imagePullPolicy: Always
          command: ["airflow", "scheduler"]
          # Avec LocalExecutor, les logs des tâches sont écrits sur le disque
          # de ce Pod et servis par `airflow serve-logs` (lancé par le
          # scheduler) ; le webserver vient les lire ici en HTTP.
          ports:
            - name: worker-logs
              containerPort: 8793
          envFrom:
            - configMapRef:
                name: price-tracker-config
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            # Le hostname enregistré avec chaque tâche est l'adresse à laquelle
            # le webserver ira chercher son log, **pour toujours** : il est figé
            # dans la base au lancement de la tâche. On publiait l'IP du Pod,
            # qui change à chaque recréation (déploiement, nœud redémarré) :
            # tous les logs écrits avant devenaient injoignables, bien que
            # présents sur le volume. Les DAGs lancés toutes les 30 min
            # gardaient des logs récents lisibles ; le scrape, lancé une fois
            # par nuit, presque jamais. getfqdn rend le nom DNS stable défini
            # par hostname + subdomain (cf. plus haut).
            - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
              value: airflow.utils.net.getfqdn
            # Le webserver signe sa requête de log avec cette clé et le serveur
            # de logs la vérifie : sans la même valeur des deux côtés -> 403.
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AIRFLOW_SECRET_KEY
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AIRFLOW_SQL_ALCHEMY_CONN
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: AIRFLOW_FERNET_KEY
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: MONGODB_URI
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        # Persiste les logs des tâches au-delà d'un redémarrage du Pod : sans
        # lui, chaque redéploiement efface l'historique des runs.
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
---
# Service headless (sans IP virtuelle) : il ne sert qu'à publier dans le DNS du
# cluster le nom stable du Pod scheduler (hostname + subdomain), auquel le
# webserver vient lire les logs des tâches sur le port 8793.
apiVersion: v1
kind: Service
metadata:
  name: airflow-scheduler-logs
  namespace: price-tracker
spec:
  clusterIP: None
  selector:
    app: airflow-scheduler
  # Le scheduler n'a pas de readinessProbe ; publier le nom dès le démarrage
  # évite toute fenêtre où il ne serait pas résolu.
  publishNotReadyAddresses: true
  ports:
    - name: worker-logs
      port: 8793
      targetPort: 8793
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
  namespace: price-tracker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
